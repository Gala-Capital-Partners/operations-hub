name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (typecheck + build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json

      - run: npm ci
      - run: npm run typecheck:server
      - run: npm run build:server

  database:
    name: Database (migrations + RLS tests)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Same tag as the harness default in supabase/tests/location_assignment_concurrency.py,
      # pulled from Docker Hub because anonymous ECR Public pulls hit data limits on shared runners.
      POSTGRES_IMAGE: supabase/postgres:17.11.0.004
    steps:
      - uses: actions/checkout@v6

      # The harness never downloads images itself (docker run --pull=never).
      - name: Pull Postgres image
        run: |
          for attempt in 1 2 3; do
            docker pull "$POSTGRES_IMAGE" && exit 0
            echo "Pull failed (attempt $attempt); retrying in 15s"
            sleep 15
          done
          exit 1
      - run: python3 supabase/tests/location_assignment_concurrency.py --image "$POSTGRES_IMAGE"
  backend-test:
    name: Backend (tests)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json

      - run: npm ci
      - run: npm run test:server

  frontend:
    name: Frontend (lint + build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm run build:client